<!DOCTYPE html>
<html>
<head>
<base target="_top">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<title>넥스트 보관함 감시</title>
<meta charset="utf-8">
<style>
  body{margin:0;font-family:-apple-system,"Malgun Gothic",sans-serif;background:#111;color:#eee}
  #bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#222}
  #bar.hide,#stat.hide,#more.hide{display:none}
  #more{width:100%;display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px solid #444}
  .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:#aaa}
  #bMenu{position:fixed;top:6px;right:6px;z-index:5;background:#2563eb;opacity:.85}
  #bFull{position:fixed;top:6px;right:118px;z-index:5;background:#2563eb;opacity:.85}
  :fullscreen #bFull{display:none}
  #zoom{position:fixed;right:6px;bottom:10px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(0,0,0,.5);padding:6px;border-radius:10px}
  #zoom button{font-size:22px;width:52px;height:52px;padding:0;background:#2563eb}
  #zv{font-size:13px}
  button,select{font-size:15px;padding:9px 11px;border-radius:8px;border:0;background:#3a3a3a;color:#fff}
  button.on{background:#2563eb}
  #msg{padding:10px 230px 10px 10px;font-size:17px;background:#1d3557;line-height:1.4}
  #msg.err{background:#7f1d1d}
  #stat{padding:6px 8px;font-size:13px;color:#bbb}
  canvas{display:block;margin:0 auto;max-width:100%;max-height:86vh;width:auto;height:auto;touch-action:none}
  label{font-size:14px;display:flex;align-items:center;gap:4px}
  video{position:absolute;width:1px;height:1px;opacity:0}
  #dim{display:none;position:fixed;inset:0;background:#000;z-index:9}
  #dimTxt{position:absolute;color:#6b7280;font-size:18px;line-height:1.5;text-align:center;white-space:nowrap}
</style>
</head>
<body>
<button id="bMenu">메뉴 숨기기</button>
<div id="zoom"><button id="zIn">＋</button><span id="zv">1배</span><button id="zOut">－</button></div>
<button id="bFull">전체 화면</button>
<div id="bar">
  <button id="bZero">영점 맞추기 (보관함 비었을 때)</button>
  <button id="bDim">화면 검게</button>
  <button id="bMore">설정 ▾</button>
  <div id="more" class="hide">
    <div class="grp">카메라 <select id="cam"></select><button id="bStart">다시 켜기</button><button id="bFlip">앞/뒤</button><button id="bRot">90° 돌리기</button><button id="bMir">좌우 뒤집기</button></div>
    <div class="grp">맡을 보관함 <select id="side"><option value="ALL">둘 다</option><option value="L">왼쪽만(25~111)</option><option value="R">오른쪽만(61~112)</option></select></div>
    <div class="grp">네모 조정 <button id="gUp">위로</button><button id="gDn">아래로</button><button id="gTall">길게</button><button id="gShort">짧게</button><button id="gWide">넓게</button><button id="gNarrow">좁게</button></div>
    <div class="grp">직접 하기 <button id="bCal">칸 직접 맞추기</button><button id="bBase">빈 보관함 기준만 저장</button></div>
    <div class="grp"><button id="bOne">이 칸만 빈칸으로</button><button id="bNow">지금 검사</button><button id="bHide">네모 숨기기</button><button id="bRef">기준 사진 보기</button><label>민감도 <input id="thr" type="range" min="5" max="60" value="20"><span id="thrv">20</span>%</label></div>
  </div>
</div>
<div id="msg">보관함이 비었을 때 [영점 맞추기]를 한 번 눌러 주세요. 번호표를 찾아 칸을 맞추고 빈 보관함 사진까지 저장해요</div>
<div id="stat"></div>
<canvas id="view"></canvas>
<video id="v" playsinline muted autoplay></video>
<div id="dim"><div id="dimTxt"></div></div>

<script>
/* ===== 설정 ===== */
const WEBAPP_URL = '';            // 페이지를 앱스 스크립트 밖에 올릴 때만 웹 앱 주소를 넣음
const KEY = 'nx-box-0911';
const INTERVAL = 30000;           // 30초마다 검사(2번 연속 같아야 기록 → 약 1분 안쪽)
const BEAT = 120000;              // 5분마다 살아 있다는 신호
const GRID_W = 8, GRID_H = 16, DIFF = 30;
const range = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);
// 보관함 줄 구성(사진 11/8 기준). 칸 번호가 바뀌면 여기만 고친다.
const ROWS = [
  {box: 'L', slots: range(25, 36)},
  {box: 'L', slots: range(37, 48)},
  {box: 'L', slots: [...range(50, 60), 109]},
  {box: 'L', slots: [110, 111]},
  {box: 'R', slots: range(61, 72)},
  {box: 'R', slots: range(73, 84)},
  {box: 'R', slots: range(85, 96)},
  {box: 'R', slots: [...range(97, 103), 112, ...range(105, 108)]},
];

/* ===== 상태 ===== */
let side = (function(){ try { return localStorage.getItem('nxside') || 'ALL'; } catch (e) { return 'ALL'; } })();
const activeRows = () => side === 'ALL' ? ROWS : ROWS.filter(r => r.box === side);
const $ = id => document.getElementById(id);
const v = $('v'), view = $('view'), vctx = view.getContext('2d');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', {willReadFrequently: true});
let calib = null, base = {}, thr = 20, regions = [];
let slotState = {}, lastScores = {}, prevFeat = {};
let mode = '', calStep = 0, calTmp = [];
let queue = loadLocal('nxq', []);
let lastCheck = 0, lastBeat = 0, serverOk = null, stream = null, wakeLock = null;

function loadLocal(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function saveLocal(k, val) { try { localStorage.setItem(k, JSON.stringify(val)); } catch (e) {} }
function msg(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }
const hhmmss = ms => new Date(ms).toLocaleTimeString('ko-KR', {hour12: false});

/* ===== 서버 호출 ===== */
// 앱스 스크립트 밖(공기계에 저장한 파일 등)에서 열면 웹 앱 주소(…/exec)를 한 번 물어보고 기억한다
function serverUrl() {
  if (WEBAPP_URL) return WEBAPP_URL;
  let u = '';
  try { u = localStorage.getItem('nxurl') || ''; } catch (e) {}
  return u;
}
function askServerUrl() {
  if (window.google && google.script && google.script.run) return;
  if (serverUrl()) return;
  const u = (prompt('보관함 감시 웹 앱 주소(…/exec)를 붙여 넣어 주세요') || '').trim();
  if (u) { try { localStorage.setItem('nxurl', u); } catch (e) {} }
}
function call(payload) {
  return new Promise((res, rej) => {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(payload);
    } else if (serverUrl()) {
      fetch(serverUrl(), {method: 'POST', body: JSON.stringify(Object.assign({key: KEY}, payload))})
        .then(r => r.json()).then(res, rej);
    } else rej(new Error('no server'));
  });
}

/* ===== 기준값 인코딩 ===== */
const toHex = f => Array.from(f, b => b.toString(16).padStart(2, '0')).join('');
const fromHex = h => { const a = new Uint8Array(h.length / 2); for (let i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; };
function encodeBase() { const o = {}; for (const s in base) o[s] = toHex(base[s]); return JSON.stringify(o); }
function decodeBase(str) {
  base = {}; if (!str) return;
  try { const o = JSON.parse(str); for (const s in o) base[s] = fromHex(o[s]); } catch (e) {}
  // 11/12 아침처럼 검은 화면으로 저장된 기준은 쓰지 않음
  const vals = Object.values(base); if (vals.length && vals.every(a => a.every(x => x < 10))) base = {};
}

async function saveSettings() {
  const b = encodeBase();
  saveLocal('nxset_' + side, {calib, base: b, thr});
  try { await call({type: 'saveSettings', calib, base: b, threshold: thr, side}); serverOk = true; }
  catch (e) { serverOk = false; }
}
async function loadSettings() {
  // 이 기기에 저장된 설정을 먼저 쓰고(가장 최신), 없을 때만 시트에서 불러옴
  let s = null;
  const l = loadLocal('nxset_' + side, null);
  if (l && l.calib) s = {calib: l.calib, base: l.base, threshold: l.thr};
  else { try { s = await call({type: 'loadSettings', side}); } catch (e) {} }
  if (s) { calib = s.calib; decodeBase(s.base); if (s.threshold) thr = s.threshold; }
  anchor = loadLocal('nxanchor_' + side, null); off = {x: 0, y: 0}; camBad = 0; camAlarm = false;
  computeRegions(); await loadRef();
  if (!Object.keys(base).length) { refImg = null; Hn = null; aligned = null; prepRef(); anchor = null; } // 기준이 없거나 버린 경우 대조용 사진도 안 씀
  $('thr').value = thr; $('thrv').textContent = thr;
  computeRegions();
}

/* ===== 칸 위치 계산 ===== */
// 네모 모양(번호표 기준 위로 얼마나·폭 얼마나) — [네모 조정] 버튼으로 바꾸고 이 기기에 기억
let geom = Object.assign({top: 0.82, bot: 0.12, w: 0.32, dy: 0}, (function(){ try { return JSON.parse(localStorage.getItem('nxgeom')) || {}; } catch (e) { return {}; } })());
function adjGeom(k, d) {
  geom[k] = Math.round((geom[k] + d) * 100) / 100;
  if (geom.top < geom.bot + 0.15) geom.top = geom.bot + 0.15;
  geom.w = Math.max(0.1, Math.min(0.5, geom.w));
  try { localStorage.setItem('nxgeom', JSON.stringify(geom)); } catch (e) {}
  computeRegions(); slotState = {}; prevFeat = {}; lastScores = {};
  if (baseFromRef()) { prepRef(); saveSettings(); msg('네모를 조정했어요. 빈칸 기준도 자동으로 다시 계산했어요'); }
  else msg('네모를 조정했어요. 다 맞추면 보관함이 비었을 때 ② 빈 보관함 기준 저장을 눌러 주세요');
  render();
}
function computeRegions() { regions = buildRegions(calib); }
function buildRegions(cal) {
  const out = [];
  const AR = activeRows();
  if (!cal || cal.length !== AR.length) return out;
  const info = AR.map((r, i) => ({box: r.box, slots: r.slots, c: cal[i], y: (cal[i].y1 + cal[i].y2) / 2, row: i}));
  info.forEach(ri => {
    const same = info.filter(o => o.box === ri.box);
    const idx = same.indexOf(ri);
    const gap = idx > 0 ? ri.y - same[idx - 1].y : (same[idx + 1] ? same[idx + 1].y - ri.y : 0.1);
    const n = ri.slots.length;
    const sp = n > 1 ? (ri.c.x2 - ri.c.x1) / (n - 1) : 0.03;
    const P = ri.c.pts && ri.c.pts.length >= n ? ri.c.pts : null;
    ri.slots.forEach((s, k) => {
      const t = n > 1 ? k / (n - 1) : 0;
      let x = ri.c.x1 + (ri.c.x2 - ri.c.x1) * t;
      let y = ri.c.y1 + (ri.c.y2 - ri.c.y1) * t;
      if (P) { x = P[k][0]; y = P[k][1]; }
      out.push({slot: s, box: ri.box, row: ri.row, k, x0: x - sp * geom.w, x1: x + sp * geom.w, y0: y - gap * (geom.top - geom.dy), y1: y - gap * (geom.bot - geom.dy)});
    });
  });
  return out;
}

/* ===== 화면 잡기·특징 뽑기 ===== */
// 화면 돌리기·좌우 뒤집기: 검사용 그림과 보이는 그림에 똑같이 적용 → 칸 위치가 어긋나지 않음
let rot = (function(){ try { return +localStorage.getItem('nxrot') || 0; } catch (e) { return 0; } })();
let flipX = (function(){ try { return localStorage.getItem('nxmir') === '1'; } catch (e) { return false; } })();
function frameSize() {
  const W = v.videoWidth, H = v.videoHeight;
  return rot % 180 ? [H, W] : [W, H];
}
function drawFrame(ctx, outW, outH) {
  const W = v.videoWidth, H = v.videoHeight;
  ctx.save();
  ctx.translate(outW / 2, outH / 2);
  if (flipX) ctx.scale(-1, 1);
  ctx.rotate(rot * Math.PI / 180);
  const s = rot % 180 ? outW / H : outW / W;
  ctx.scale(s, s);
  ctx.drawImage(v, -W / 2, -H / 2, W, H);
  ctx.restore();
}
function grab() {
  if (!v.videoWidth) return null;
  const [W, H] = frameSize();
  work.width = W; work.height = H;
  drawFrame(wctx, W, H);
  return {img: wctx.getImageData(0, 0, W, H), W, H};
}
function feat(img, W, H, r) {
  const out = new Uint8Array(GRID_W * GRID_H), d = img.data;
  const X0 = r.x0 * W, X1 = r.x1 * W, Y0 = r.y0 * H, Y1 = r.y1 * H;
  const cw = (X1 - X0) / GRID_W, ch = (Y1 - Y0) / GRID_H;
  for (let gy = 0; gy < GRID_H; gy++) for (let gx = 0; gx < GRID_W; gx++) {
    let sum = 0, c = 0;
    const xs = Math.max(0, Math.floor(X0 + gx * cw)), xe = Math.min(W, Math.floor(X0 + (gx + 1) * cw));
    const ys = Math.max(0, Math.floor(Y0 + gy * ch)), ye = Math.min(H, Math.floor(Y0 + (gy + 1) * ch));
    for (let y = ys; y < ye; y += 2) for (let x = xs; x < xe; x += 2) {
      const p = (y * W + x) * 4; sum += d[p] * 0.299 + d[p + 1] * 0.587 + d[p + 2] * 0.114; c++;
    }
    out[gy * GRID_W + gx] = c ? Math.round(sum / c) : 0;
  }
  return out;
}
function fracDiff(a, b, k) { let n = 0; for (let i = 0; i < a.length; i++) if (Math.abs(a[i] * k - b[i]) > DIFF) n++; return n / a.length; }

/* ===== 카메라 움직임 확인 =====
 빈 보관함 기준을 저장할 때, 폰이 안 들어가는 자리(번호표 줄·보관함 틀)를 작은 그림으로 같이 저장.
 검사 때마다 지금 화면과 맞대 보고
  - 조금 밀렸으면: 네모를 같이 옮김(자동 보정)
  - 많이 움직였으면: 감지를 멈추고 경고 + 시트에 기록 */
const AW = 240, AR_ = 12; // 비교용 그림 폭, 찾아볼 범위(±픽셀, 폭의 약 5%)
const small = document.createElement('canvas'), sctx = small.getContext('2d', {willReadFrequently: true});
let anchor = null; // loadSettings에서 이 기기·이 보관함 것으로 읽음
let off = {x: 0, y: 0}, camBad = 0, camAlarm = false;
function smallGray() {
  const [W, H] = frameSize(); const h = Math.round(AW * H / W);
  small.width = AW; small.height = h; drawFrame(sctx, AW, h);
  const d = sctx.getImageData(0, 0, AW, h).data, g = new Uint8Array(AW * h);
  for (let i = 0; i < g.length; i++) g[i] = d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114;
  return {g, w: AW, h};
}
function anchorMask(w, h) { // 보관함 둘레(조금 넓게) 안 + 폰 자리(네모) 밖 = 안 변하는 곳
  const m = new Uint8Array(w * h); if (!regions.length) return m;
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  regions.forEach(r => { x0 = Math.min(x0, r.x0); y0 = Math.min(y0, r.y0); x1 = Math.max(x1, r.x1); y1 = Math.max(y1, r.y1); });
  const px = (x1 - x0) * 0.05, py = (y1 - y0) * 0.08;
  const X0 = Math.max(AR_, Math.floor((x0 - px) * w)), X1 = Math.min(w - AR_, Math.ceil((x1 + px) * w));
  const Y0 = Math.max(AR_, Math.floor((y0 - py) * h)), Y1 = Math.min(h - AR_, Math.ceil((y1 + py) * h));
  for (let y = Y0; y < Y1; y++) for (let x = X0; x < X1; x++) m[y * w + x] = 1;
  regions.forEach(r => {
    for (let y = Math.max(0, Math.floor(r.y0 * h) - 1); y < Math.min(h, Math.ceil(r.y1 * h) + 1); y++)
      for (let x = Math.max(0, Math.floor(r.x0 * w) - 1); x < Math.min(w, Math.ceil(r.x1 * w) + 1); x++) m[y * w + x] = 0;
  });
  return m;
}
function saveAnchor() {
  const s = smallGray();
  anchor = {w: s.w, h: s.h, g: toHex(s.g), noise: 0};
  off = {x: 0, y: 0}; camBad = 0; camAlarm = false;
  saveLocal('nxanchor_' + side, anchor);
}
function shiftErr(ref, cur, m, w, h, dx, dy, k) {
  let e = 0, n = 0;
  for (let y = AR_; y < h - AR_; y += 2) for (let x = AR_; x < w - AR_; x += 2) {
    const i = y * w + x; if (!m[i]) continue;
    e += Math.abs(cur[(y + dy) * w + x + dx] * k - ref[i]); n++;
  }
  return n ? e / n : 999;
}
// 돌려주는 값: 'ok' | 'skip'(이번만 건너뜀) | 'alarm'
async function camCheck() {
  if (!anchor || !anchor.g) return 'ok';
  const cur = smallGray(); if (cur.h !== anchor.h) return 'ok';
  const ref = fromHex(anchor.g), m = anchorMask(cur.w, cur.h);
  let rs = 0, cs2 = 0; for (let i = 0; i < m.length; i++) if (m[i]) { rs += ref[i]; cs2 += cur.g[i]; }
  const k = Math.min(1.6, Math.max(0.6, cs2 ? rs / cs2 : 1));
  let best = {e: 1e9, x: 0, y: 0};
  for (let dy = -AR_; dy <= AR_; dy++) for (let dx = -AR_; dx <= AR_; dx++) {
    const e = shiftErr(ref, cur.g, m, cur.w, cur.h, dx, dy, k);
    if (e < best.e) best = {e, x: dx, y: dy};
  }
  if (!anchor.noise) { anchor.noise = Math.max(4, best.e); saveLocal('nxanchor_' + side, anchor); }
  const atEdge = Math.abs(best.x) === AR_ || Math.abs(best.y) === AR_;
  const bad = atEdge || best.e > anchor.noise * 2.5;
  const st = camFlag(bad);
  if (st === 'ok') off = {x: best.x / cur.w, y: best.y / cur.h}; // 여기 화면이 기준보다 (x,y)만큼 밀림 → 네모도 같이 이동
  return st;
}
const sh = r => ({slot: r.slot, x0: r.x0 + off.x, x1: r.x1 + off.x, y0: r.y0 + off.y, y1: r.y1 + off.y});

/* ===== 자동 다시 맞추기 =====
 빈 보관함 기준 사진(번호표·틀 무늬)과 지금 화면을 대조해 '기준 사진 → 지금 화면' 대응(Hn)을 매번 새로 구함.
 거치대를 옮기거나 각도·거리가 바뀌어도 지금 화면을 기준 사진 자리로 펴서(aligned) 같은 네모로 검사한다.
 그림 처리 도구(OpenCV)를 못 불러오면 위의 '작은 흔들림 보정'만 쓴다. */
const CV_URL = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js';
const REF_W = 1024;
let alInfo = {}; // 맞춤 진단(시트 '보관함설정' F칸에 5분마다 남김)
let CV = null, refImg = null, refPrep = null, Hn = null, aligned = null, lastInl = 0;
const refCan = document.createElement('canvas'), rctx = refCan.getContext('2d', {willReadFrequently: true});
function loadCv() {
  const sc = document.createElement('script'); sc.src = CV_URL; sc.async = true;
  sc.onload = async () => {
    try {
      let c = window.cv;
      if (c && typeof c.then === 'function' && !c.Mat) c = (await new Promise(r => c.then(m => r({m})))).m;

    // 확실히 빈 칸이면 그 모습을 조금씩 익힘
    if (st.s === 0 && s < thr * 0.6) { const o = ownT[r.slot]; if (!o) ownT[r.slot] = {f: Float32Array.from(F[r.slot]), n: 1}; else { const a = o.n < 10 ? 1 / (o.n + 1) : 0.1; for (let i = 0; i < o.f.length; i++) o.f[i] += (F[r.slot][i] - o.f[i]) * a; o.n++; } }
  });
  if (evs.length) { queue.push(...evs); saveLocal('nxq', queue); }
  await flush();
  const occ = Object.values(slotState).filter(s => s.s === 1).length;
  if (now - lastBeat > BEAT) {
    lastBeat = now;
    // 칸별 점수(틈/이웃)를 남겨, 실제 꽂힌 칸과 맞춰 보며 기준을 다듬는 데 씀
    const det = Object.entries(lastRaw).map(([k, v]) => `${k}:${v[0]}/${v[1]}`).join(' ');
    const note = `새 방식 · 위치 ${alInfo.how} · 번호표 ${alInfo.lab}칸 · 연속실패 ${labFail} · 익힌 칸 ${Object.values(ownT).filter(o => o.n >= 5).length} · 꽂힘 ${Object.entries(slotState).filter(([k, v]) => v.s === 1).map(([k]) => k).join(',')} || ${det}`;
    try { await call({type: 'beat', occupied: occ, side, note}); serverOk = true; } catch (e) { serverOk = false; }
  }
  msg(evs.length ? `바뀐 칸 ${evs.length}개 기록` : '감시 중');
  render();
  return 'ok';
}

async function check() {
  lastCheck = Date.now();
  if (camDead()) { msg('카메라가 끊겨서 다시 켜는 중이에요', true); await reviveCam('검사 때 카메라 끊김'); render(); return; }
  if (calib && calib[0] && calib[0].pts) { await checkRel(); return; } // 영점(번호표 자동 찾기)을 한 번이라도 했으면 새 방식
  if (!regions.length) { msg('먼저 [칸 맞추기]를 해 주세요'); return; }
  if (!Object.keys(base).length) { msg('보관함이 비었을 때 [빈 보관함 기준 저장]을 눌러 주세요'); return; }
  let cam, useA = false;
  // 1순위: 번호표 무늬 대조(자동 다시 맞추기). 안 되면 2순위: 작은 흔들림 보정(카메라가 거의 그대로면 그대로 검사)
  if (CV && refPrep) { let ok = false; alInfo.how = '';
    // 두 방법(무늬 대조·번호표 따라가기)을 다 해 보고, 기준 사진과 더 잘 맞는 쪽을 씀
    const cands = [];
    try { if (align()) cands.push({how: '무늬', Hn, aligned, e: alignErr(aligned)}); } catch (e) { alInfo.err = String(e.message || e).slice(0, 40); }
    try { if (trackLabels()) { const e = alignErr(aligned); cands.push({how: '번호표', Hn, aligned, e, strong: alInfo.labInl >= 70}); } } catch (e) { alInfo.err = 'L:' + String(e.message || e).slice(0, 30); }
    cands.sort((a, b) => a.e - b.e);
    alInfo.errs = cands.map(c => c.how + Math.round(c.e)).join('/');
    // 번호표가 70칸 넘게 정확히 짝지어지면 밝기 차이가 커도 믿음(사람·폰·조명 때문에 차이 점수가 오를 수 있음)
    const pick = cands.find(c => c.e < 30) || cands.find(c => c.strong && c.e < 70);
    if (pick) { ({Hn, aligned} = pick); alInfo.how = pick.how; ok = true; }
    if (ok) { cam = camFlag(false); useA = true; alInfo.fail = 0; } else { Hn = null; aligned = null; alInfo.fail = (alInfo.fail || 0) + 1; cam = await camCheck(); } }
  else cam = await camCheck();
  if (cam !== 'ok') {
    await flush();
    if (Date.now() - lastBeat > BEAT) { lastBeat = Date.now(); try { await call({type: 'beat', occupied: -1, side, note: `검사 건너뜀(${cam}) · 점 ${alInfo.ref || 0}/${alInfo.cur || 0} · 짝 ${alInfo.good || 0} · 일치 ${alInfo.inl || 0}${alInfo.sane === false ? ' · 모양이상' : ''} · 연속실패 ${alInfo.fail || 0}`}); } catch (e) {} }
    msg(cam === 'alarm' ? '⚠ 보관함이 안 보여요. 보관함 두 개가 화면에 다 들어오게 놓으면 저절로 다시 맞춰요' : '화면이 기준과 달라 이번 검사는 건너뛰었어요(가림 또는 움직임)', cam === 'alarm');
    render(); return;
  }
  const g = useA ? null : grab(); if (!useA && !g) return;
  const feats = {}; let cs = 0, bs = 0;
  regions.forEach(r => {
    const f = useA ? feat(aligned, aligned.width, aligned.height, r) : feat(g.img, g.W, g.H, sh(r)); feats[r.slot] = f;
    const b = base[r.slot]; if (b) for (let i = 0; i < f.length; i++) { cs += f[i]; bs += b[i]; }
  });
  const k = Math.min(1.6, Math.max(0.6, cs ? bs / cs : 1)); // 밝기 보정

  // 사람이 앞을 가리면 한 번에 많은 칸이 바뀜 → 이번 검사는 건너뜀
  let moved = 0, tot = 0;
  regions.forEach(r => { const p = prevFeat[r.slot]; if (p) { tot++; if (fracDiff(feats[r.slot], p, 1) > 0.35) moved++; } });
  prevFeat = feats;
  if (tot && moved / tot > 0.3) { msg('앞이 가려져서 이번 검사는 건너뛰었어요'); render(); return; }

  const now = Date.now(), evs = [];
  regions.forEach(r => {
    const b = base[r.slot]; if (!b) return;
    const sc = Math.round(fracDiff(feats[r.slot], b, k) * 100);
    lastScores[r.slot] = sc;
    const nw = sc >= thr ? 1 : 0;
    const st = slotState[r.slot] || (slotState[r.slot] = {s: null, p: 0, pt: 0});
    if (st.s === null) { st.s = nw; if (nw === 1) evs.push({t: now, slot: r.slot, state: 2, score: sc}); return; }
    if (nw !== st.s) {
      if (st.p === 0) st.pt = now;
      st.p++;
      if (st.p >= 2) { st.s = nw; st.p = 0; evs.push({t: st.pt, slot: r.slot, state: nw, score: sc}); }
    } else st.p = 0;
  });
  if (evs.length) { queue.push(...evs); saveLocal('nxq', queue); }
  await flush();
  const occ = Object.values(slotState).filter(s => s.s === 1).length;
  if (now - lastBeat > BEAT) {
    lastBeat = now;
    const note = `맞춤 ${Hn ? (alInfo.how || '무늬') : (off.x || off.y) ? '흔들림보정' : '그대로'} · 차이 ${alInfo.errs || '-'} · 번호표 ${alInfo.lab || 0}칸/일치 ${alInfo.labInl || 0} · 점 ${alInfo.ref || 0}/${alInfo.cur || 0} · 짝 ${alInfo.good || 0} · 일치 ${alInfo.inl || 0}${alInfo.sane === false ? ' · 모양이상' : ''} · 연속실패 ${alInfo.fail || 0}${alInfo.err ? ' · ' + alInfo.err : ''}`;
    try { await call({type: 'beat', occupied: occ, side, note}); serverOk = true; } catch (e) { serverOk = false; }
  }
  msg(evs.length ? `바뀐 칸 ${evs.length}개 기록` : '감시 중');
  render();
}
async function flush() {
  if (!queue.length) return;
  const batch = queue.slice(0, 200);
  try {
    const r = await call({type: 'events', events: batch});
    if (r && r.ok) { queue.splice(0, batch.length); saveLocal('nxq', queue); serverOk = true; } else serverOk = false;
  } catch (e) { serverOk = false; }
}

/* ===== 그리기 ===== */
/* ===== 확대 보기(칸 맞추기용) — 검사에는 영향 없음 ===== */
let vz = 1, vcx = 0.5, vcy = 0.5;
const full = document.createElement('canvas'), fctx = full.getContext('2d');
function viewWin() {
  const w = 1 / vz;
  return {w, x0: Math.min(Math.max(vcx - w / 2, 0), 1 - w), y0: Math.min(Math.max(vcy - w / 2, 0), 1 - w)};
}
function setZoom(z) { vz = Math.max(1, Math.min(4, z)); $('zv').textContent = vz + '배'; render(); }
function render() {
  if (v.videoWidth) {
    const [W, H] = frameSize();
    const s = Math.min(1, 1280 / Math.max(W, H));
    view.width = Math.round(W * s); view.height = Math.round(H * s);
    if (showRef && refImg) { const c = document.createElement('canvas'); c.width = refImg.width; c.height = refImg.height; c.getContext('2d').putImageData(refImg, 0, 0); vctx.drawImage(c, 0, 0, view.width, view.height); }
    else if (vz === 1) drawFrame(vctx, view.width, view.height);
    else {
      const fs = Math.min(1, 1800 / Math.max(W, H));
      full.width = Math.round(W * fs); full.height = Math.round(H * fs);
      drawFrame(fctx, full.width, full.height);
      const z = viewWin();
      vctx.drawImage(full, z.x0 * full.width, z.y0 * full.height, z.w * full.width, z.w * full.height, 0, 0, view.width, view.height);
    }
  }
  const VW = view.width, VH = view.height;
  const Z = viewWin(), SX = nx => (nx - Z.x0) / Z.w * VW, SY = ny => (ny - Z.y0) / Z.w * VH;
  vctx.lineWidth = 2; vctx.font = 'bold 13px sans-serif';
  if (!hideBoxes) regions.forEach(r => {
    const st = slotState[r.slot];
    const col = !st || st.s === null ? '#999' : st.p ? '#facc15' : st.s ? '#22c55e' : '#64748b';
    vctx.strokeStyle = col;
    const P = [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]].map(([x, y]) => showRef ? [x, y] : toCur(x, y));
    vctx.beginPath(); P.forEach(([x, y], i) => i ? vctx.lineTo(SX(x), SY(y)) : vctx.moveTo(SX(x), SY(y))); vctx.closePath(); vctx.stroke();
    vctx.fillStyle = col;
    const sc = lastScores[r.slot];
    vctx.fillText(r.slot + (sc !== undefined ? ' ' + sc : ''), SX(P[0][0]), SY(P[0][1]) - 3);
  });
  if (mode === 'cal') {
    vctx.fillStyle = '#f43f5e';
    calTmp.forEach(p => { vctx.beginPath(); vctx.arc(SX(p.x), SY(p.y), 6, 0, 7); vctx.fill(); });
  }
  const occ = Object.values(slotState).filter(s => s.s === 1).length;
  $('stat').textContent = `마지막 검사 ${lastCheck ? hhmmss(lastCheck) : '-'} · 꽂힘 ${occ}칸 · 못 보낸 기록 ${queue.length}개 · 서버 ${serverOk === null ? '-' : serverOk ? '정상' : '연결 안 됨'} · 카메라 ${camAlarm ? '⚠ 움직임' : (CV && refPrep) ? (Hn ? '자동 맞춤(대조점 ' + lastInl + '개)' : '맞추는 중') : !anchor ? '기준 없음' : (off.x || off.y) ? '조금 밀림(보정 중)' : '제자리'}${CV ? '' : ' · 자동 맞춤 도구 불러오는 중'}`;
}

/* ===== 칸 맞추기 ===== */
function calPrompt() {
  const r = Math.floor(calStep / 2), first = calStep % 2 === 0;
  const row = activeRows()[r];
  const slot = first ? row.slots[0] : row.slots[row.slots.length - 1];
  msg(`${row.box === 'L' ? '왼쪽' : '오른쪽'} 보관함 ${slot}번 번호표 가운데를 누르세요 (${calStep + 1}/${activeRows().length * 2})`);
}
let down = null;
view.addEventListener('pointerdown', e => { down = {x: e.clientX, y: e.clientY, cx: vcx, cy: vcy, moved: false}; });
view.addEventListener('pointermove', e => {
  if (!down || vz === 1) return;
  const rect = view.getBoundingClientRect(), w = 1 / vz;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.abs(dx) + Math.abs(dy) > 12) down.moved = true;
  if (down.moved) { vcx = down.cx - dx / rect.width * w; vcy = down.cy - dy / rect.height * w; render(); }
});
view.addEventListener('pointerup', async e => {
  const d = down; down = null;
  if (!d || d.moved) return; // 끌어서 옮긴 건 누른 걸로 치지 않음
  const rect = view.getBoundingClientRect(), Z = viewWin();
  const [x, y] = toRef(Z.x0 + (e.clientX - rect.left) / rect.width * Z.w, Z.y0 + (e.clientY - rect.top) / rect.height * Z.w);
  if (mode === 'cal') {
    calTmp.push({x, y}); calStep++;
    if (calStep >= activeRows().length * 2) {
      calib = [];
      for (let i = 0; i < activeRows().length; i++) {
        const a = calTmp[i * 2], b = calTmp[i * 2 + 1];
        calib.push({x1: a.x, y1: a.y, x2: b.x, y2: b.y});
      }
      mode = ''; $('bCal').classList.remove('on'); calTmp = [];
      computeRegions(); slotState = {}; prevFeat = {}; lastScores = {};
      const re = baseFromRef(); prepRef();
      await saveSettings();
      msg(re ? '칸 맞추기 저장 완료. 빈칸 기준도 저장된 기준 사진으로 다시 계산했어요.' : '칸 맞추기 저장 완료. 네모가 칸 위(폰이 보이는 자리)에 맞으면, 보관함이 비었을 때 ② 빈 보관함 기준 저장을 눌러 주세요.');
    } else calPrompt();
    render();
  } else if (mode === 'one') {
    const r = regions.find(q => x >= q.x0 && x <= q.x1 && y >= q.y0 && y <= q.y1);
    if (!r) { msg('네모 안을 눌러 주세요'); return; }
    if (aligned && Hn) base[r.slot] = feat(aligned, aligned.width, aligned.height, r);
    else { const g = grab(); if (!g) return; base[r.slot] = feat(g.img, g.W, g.H, sh(r)); }
    slotState[r.slot] = {s: 0, p: 0, pt: 0};
    mode = ''; $('bOne').classList.remove('on');
    await saveSettings();
    msg(`${r.slot}번 칸을 빈칸 기준으로 저장했어요`);
    render();
  }
});

}, true);
setMenu((function(){ try { return localStorage.getItem('nxmenu') !== '0'; } catch (e) { return true; } })());
// AMOLED(노트9) 번인 방지: 검은 화면으로 가려도 카메라·검사는 계속 돈다
let dimmed = false;
// 검은 화면 위에 '감시 중 · 마지막 검사 시각'을 흐리게 표시(꺼진 것과 구별), 번인 막으려고 1분마다 자리 이동
function dimText() {
  if (!dimmed) return;
  const occ = Object.values(slotState).filter(s => s.s === 1).length;
  const ok = lastCheck && Date.now() - lastCheck < INTERVAL * 3;
  const t = $('dimTxt');
  t.innerHTML = (ok ? '감시 중' : '⚠ 검사 멈춤') + ' · 마지막 검사 ' + (lastCheck ? hhmmss(lastCheck) : '-') + '<br>꽂힘 ' + occ + '칸 · 화면을 누르면 다시 보여요';
  t.style.color = ok ? '#6b7280' : '#b45309';
  const m = new Date().getMinutes();
  t.style.left = (10 + (m * 37) % 50) + '%'; t.style.top = (15 + (m * 23) % 60) + '%';
}
setInterval(dimText, 10000);
function setDim(on) { dimmed = on; $('dim').style.display = on ? 'block' : 'none'; dimText(); }
$('bDim').onclick = () => setDim(true);
$('dim').onclick = () => setDim(false);
let idleTimer = null;
function armIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (mode === '') setDim(true); }, 180000); }
document.addEventListener('pointerdown', armIdle);
let thrTimer = null;
$('thr').oninput = e => {
  thr = +e.target.value; $('thrv').textContent = thr;
  clearTimeout(thrTimer); thrTimer = setTimeout(saveSettings, 1500);
};
$('bStart').onclick = () => startCam($('cam').value || null);
// 고른 카메라(예: camera2 2)를 이 기기에 기억 → 다시 열어도 같은 카메라로 켬(영점이 안 어긋나게)
$('cam').onchange = e => { try { localStorage.setItem('nxcam', e.target.value); } catch (er) {} startCam(e.target.value); };
// 앞/뒤 카메라 전환(전면이 더 넓게 보이는 기기도 있음). 고른 방향은 이 기기에 기억
let facing = (function(){ try { return localStorage.getItem('nxfacing') || 'environment'; } catch (e) { return 'environment'; } })();
function afterTransform(t) {
  calib = null; regions = []; slotState = {}; prevFeat = {}; lastScores = {};
  refImg = null; Hn = null; aligned = null; prepRef(); try { localStorage.removeItem('nxref_' + side); } catch (e) {}
  msg(t + ' 칸 위치가 바뀌니 번호표가 똑바로 보이면 [칸 맞추기]를 다시 해 주세요');
  render();
}
$('bRot').onclick = () => { rot = (rot + 90) % 360; try { localStorage.setItem('nxrot', rot); } catch (e) {} afterTransform('화면을 ' + rot + '° 돌렸어요.'); };
$('bMir').onclick = () => { flipX = !flipX; try { localStorage.setItem('nxmir', flipX ? '1' : '0'); } catch (e) {} afterTransform('좌우를 뒤집었어요.'); };
$('bFlip').onclick = () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { localStorage.setItem('nxfacing', facing); localStorage.removeItem('nxcam'); } catch (e) {}
  startCam(null);
  msg(facing === 'user' ? '앞면 카메라로 바꿨어요. 칸 위치가 달라지니 [칸 맞추기]를 다시 해 주세요' : '뒷면 카메라로 바꿨어요. 칸 위치가 달라지니 [칸 맞추기]를 다시 해 주세요');
};
$('side').value = side;
$('side').onchange = async e => {
  side = e.target.value;
  try { localStorage.setItem('nxside', side); } catch (err) {}
  calib = null; base = {}; regions = []; slotState = {}; prevFeat = {}; lastScores = {};
  await loadSettings();
  msg(regions.length ? '이 기기가 맡은 보관함 설정을 불러왔어요' : '이 기기가 맡을 보관함의 [칸 맞추기]를 해 주세요');
  render();
};

/* ===== 카메라 ===== */
async function startCam(deviceId) {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('mediaDevices 없음');
    if (stream) stream.getTracks().forEach(t => t.stop());
    // 4:3 큰 해상도로 요청 → 동영상용 16:9보다 센서를 넓게 써서 카메라 앱 사진 화면에 가깝게 보임
    const size = {width: {ideal: 2560}, height: {ideal: 1920}, aspectRatio: {ideal: 4 / 3}};
    const video = deviceId ? Object.assign({deviceId: {exact: deviceId}}, size)
                           : Object.assign({facingMode: {ideal: facing}}, size);
    stream = await navigator.mediaDevices.getUserMedia({video, audio: false});
    v.srcObject = stream; await v.play();
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const cur = stream.getVideoTracks()[0].getSettings().deviceId;
    $('cam').innerHTML = devs.map((d, i) => `<option value="${d.deviceId}" ${d.deviceId === cur ? 'selected' : ''}>${d.label || '카메라 ' + (i + 1)}</option>`).join('');
    keepAwake();
    msg(`카메라 연결됨 (${v.videoWidth}×${v.videoHeight}). ${regions.length ? '감시 중' : '[칸 맞추기]를 해 주세요'}`);
    render();
  } catch (e) {
    msg('이 화면에서는 카메라를 쓸 수 없어요: ' + (e.name || '') + ' ' + (e.message || e) + ' — 이 문구를 Claude에게 알려 주세요', true);
  }
}
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
// 폰이 잠겼다 풀리면 카메라 연결이 끊겨 화면이 검게 멈춤 → 저절로 다시 켬
function camDead() {
  const t = stream && stream.getVideoTracks()[0];
  return !t || t.readyState === 'ended' || t.muted || !v.videoWidth || v.paused;
}
let lastRestart = 0;
async function reviveCam(why) {
  if (Date.now() - lastRestart < 20000) return; // 너무 자주 다시 켜지 않게
  lastRestart = Date.now();
  queue.push({t: Date.now(), slot: '카메라', state: '다시 켬 — ' + why, score: 0}); saveLocal('nxq', queue);
  await startCam($('cam').value || null);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  keepAwake();
  setTimeout(() => { if (camDead()) reviveCam('화면 켜진 뒤 카메라 끊김'); }, 1500);
});

/* ===== 시작 ===== */
(async () => {
  askServerUrl();
  loadCv();
  await loadSettings();
  let saved = null; try { saved = localStorage.getItem('nxcam'); } catch (e) {}
  await startCam(saved || null);
  if (saved && !v.videoWidth) await startCam(null); // 기억한 카메라가 없어졌으면 기본 카메라로
  setInterval(check, INTERVAL);
  // 충전기 연결 전제: 화면이 켜져 있을 때는 부드럽게(초당 약 10장), 검은 화면일 때는 그리지 않음
  setInterval(() => { if (!dimmed) render(); }, 100);
  armIdle(); // 3분 동안 손대지 않으면 자동으로 검은 화면
})();
</script>
